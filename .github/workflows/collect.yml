name: Collect events

# Re-scrapes the campus event sites once a day and saves the result to data/events.json.
# Committing that file also makes Vercel redeploy, so the live site shows fresh events.
on:
  schedule:
    # Daily at 11:07 UTC = 6:07 AM Toronto in winter, 7:07 AM in summer. Cron is always UTC.
    # (Off the hour on purpose: GitHub delays jobs queued exactly at :00.)
    - cron: "7 11 * * *"
  workflow_dispatch:   # also adds a "Run workflow" button on the Actions tab
    inputs:
      only:
        description: "Only these sources, space-separated (ssu clubs edge sheridan theatre radio). Blank = all."
        required: false
        default: ""

permissions:
  contents: write      # lets the job commit data/events.json

# Never run two collections at once
concurrency:
  group: collect-events
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Run collectors
        id: collect
        # If one source fails it keeps its previous events and the job exits with an error.
        # Carry on so the other sources' fresh data is still saved; the last step then fails the job
        # so GitHub emails you.
        continue-on-error: true
        env:
          # Optional: add an EVENTBRITE_TOKEN secret in the repo settings for the Eventbrite API.
          # Without it the EDGE source falls back to scraping the public page.
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python collect.py --only $ONLY
          else
            python collect.py
          fi

      - name: Commit data/events.json
        run: |
          if [ -z "$(git status --porcelain -- data/events.json)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "Update events data ($(date -u +%Y-%m-%d))"
          # Retry if someone pushed in the meantime
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Fail if any source failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::At least one source failed. Its previous events were kept. See the 'Run collectors' log."
          exit 1
