<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the app use the full screen on notched phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5ed7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Sheridan Central</title>
  <style>
    :root {
      --brand: #0b5ed7;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --text: #1a1f2b;
      --muted: #6b7280;
      --border: #e5e7eb;
      --header-h: 56px;
      --nav-h: 64px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1218;
        --surface: #1a1f2b;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --border: #2a3040;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    /* The "phone screen": full viewport on a phone, a centered phone-sized frame on desktop */
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 500px) {
      body { display: grid; place-items: center; background: #cfd6e0; }
      .app {
        height: min(880px, 100dvh - 32px);
        width: 390px;
        border-radius: 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
      }
    }

    .header {
      flex: none;
      height: calc(var(--header-h) + var(--safe-top));
      padding: var(--safe-top) 16px 0;
      display: flex;
      align-items: center;
      background: var(--brand);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 600;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
    }

    .view { display: none; }
    .view.active { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h2 { font-size: 1rem; margin-bottom: 4px; }
    .card p { font-size: .9rem; color: var(--muted); line-height: 1.4; }

    .nav {
      flex: none;
      display: flex;
      height: calc(var(--nav-h) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .nav button {
      flex: 1;
      min-height: 44px; /* comfortable touch target */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: none;
      border: 0;
      color: var(--muted);
      font: inherit;
      font-size: .72rem;
      cursor: pointer;
    }
    .nav button .icon { font-size: 1.35rem; line-height: 1; }
    .nav button.active { color: var(--brand); font-weight: 600; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">Sheridan Central</header>

    <main class="content">
      <section class="view active" id="home">
        <div class="card">
          <h2>Welcome</h2>
          <p>This is the starting point for the Sheridan Central app.</p>
        </div>
      </section>
      <section class="view" id="explore">
        <div class="card">
          <h2>Explore</h2>
          <p>Content coming soon.</p>
        </div>
      </section>
      <section class="view" id="profile">
        <div class="card">
          <h2>Profile</h2>
          <p>Content coming soon.</p>
        </div>
      </section>
    </main>

    <nav class="nav" aria-label="Main">
      <button class="active" data-view="home"><span class="icon">🏠</span>Home</button>
      <button data-view="explore"><span class="icon">🔍</span>Explore</button>
      <button data-view="profile"><span class="icon">👤</span>Profile</button>
    </nav>
  </div>

  <script>
    // Simple tab switching between views
    const tabs = document.querySelectorAll('.nav button');
    const views = document.querySelectorAll('.view');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.toggle('active', t === tab));
        views.forEach(v => v.classList.toggle('active', v.id === tab.dataset.view));
      });
    });
  </script>
</body>
</html>
